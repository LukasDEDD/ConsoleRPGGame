apiVersion: apps/v1
kind: Deployment
metadata:
  name: consolerpggame-deployment
  labels:
    app: consolerpggame
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consolerpggame
  template:
    metadata:
      labels:
        app: consolerpggame
    spec:
      containers:
        - name: consolerpggame
          image: vasedockerjmeno/consolerpggame:latest  # Nahraďte svým jménem na Docker Hubu
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"